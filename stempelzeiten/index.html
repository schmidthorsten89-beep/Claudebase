<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stempelzeiten</title>
<meta name="description" content="Arbeitszeiterfassung mit Homeoffice-Quote, bayerischen Feiertagen, Planung und Urlaub – offline am Handy.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stempelzeiten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f4f2ed; --card: #ffffff; --ink: #1d2129; --muted: #6b7280; --line: #e3e0d8;
    --accent: #2563c9; --accent-ink: #ffffff;
    --ho: #0f8a6c; --ho-soft: #d7f2e9;
    --buero: #2563c9; --buero-soft: #dde8fb;
    --urlaub: #c77700; --urlaub-soft: #fdebc8;
    --krank: #b42318; --krank-soft: #fbdcd8;
    --frei: #8a8f98; --frei-soft: #ecebe6;
    --gz: #7a4fd0; --gz-soft: #eae1fb;
    --plus: #0f8a6c; --minus: #b42318;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --card: #1d2028; --ink: #eceef2; --muted: #9aa1ad; --line: #2e323c;
      --accent: #5b8ff0; --accent-ink: #0d1422;
      --ho: #34c39d; --ho-soft: #173a31;
      --buero: #6d9bf2; --buero-soft: #1d2b45;
      --urlaub: #f0a63a; --urlaub-soft: #3d2e14;
      --krank: #f0776b; --krank-soft: #42201d;
      --frei: #7c818b; --frei-soft: #262930;
      --gz: #a888f0; --gz-soft: #2e2546;
      --plus: #34c39d; --minus: #f0776b;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             calc(84px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .plus { color: var(--plus); } .minus { color: var(--minus); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; min-height: 44px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ho { background: var(--ho); color: #fff; border-color: var(--ho); }
  .btn.buero { background: var(--buero); color: #fff; border-color: var(--buero); }
  .btn.danger { color: var(--minus); }
  .btn.big { padding: 16px; font-size: 18px; flex: 1; border-radius: 14px; min-height: 60px; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .45; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
  input[type=time] { min-width: 96px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.field input, label.field select { color: var(--ink); font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Heute */
  .clock { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .status.ho { background: var(--ho-soft); color: var(--ho); }
  .status.buero { background: var(--buero-soft); color: var(--buero); }
  .status.pause { background: var(--urlaub-soft); color: var(--urlaub); }
  .status.off { background: var(--frei-soft); color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 10px; }
  .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .timeline li:last-child { border-bottom: 0; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tag.ho { background: var(--ho-soft); color: var(--ho); }
  .tag.b { background: var(--buero-soft); color: var(--buero); }
  .tag.p { background: var(--urlaub-soft); color: var(--urlaub); }

  /* Kalender */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .monthbar b { font-size: 18px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; }
  .brushes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
  .brush { flex: 0 0 auto; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; min-height: 38px; }
  .brush.on { border-color: var(--ink); }
  .brush .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
  .day { position: relative; border-radius: 10px; min-height: 58px; padding: 4px; background: var(--card); border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .day .d { font-weight: 700; font-size: 14px; }
  .day .h { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .day .lbl { font-size: 10px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day.we { background: var(--frei-soft); }
  .day.ft { background: var(--frei-soft); }
  .day.ft .lbl { color: var(--muted); }
  .day.k-ho { background: var(--ho-soft); } .day.k-ho .lbl { color: var(--ho); }
  .day.k-b { background: var(--buero-soft); } .day.k-b .lbl { color: var(--buero); }
  .day.k-mix { background: linear-gradient(135deg, var(--ho-soft) 50%, var(--buero-soft) 50%); }
  .day.k-mix .lbl { color: var(--ink); }
  .day.k-u, .day.k-hu { background: var(--urlaub-soft); } .day.k-u .lbl, .day.k-hu .lbl { color: var(--urlaub); }
  .day.k-k { background: var(--krank-soft); } .day.k-k .lbl { color: var(--krank); }
  .day.k-gz { background: var(--gz-soft); } .day.k-gz .lbl { color: var(--gz); }
  .day.plan { border-style: dashed; border-width: 2px; }
  .day.empty { visibility: hidden; }
  .day.miss .h { color: var(--minus); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }

  .bar { position: relative; height: 14px; border-radius: 999px; background: var(--buero-soft); overflow: hidden; margin: 8px 0 4px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ho); border-radius: 999px; }
  .bar .goal { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .bignum { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 8px 0 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button.on { color: var(--accent); font-weight: 700; }

  /* Sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; z-index: 21; padding: 16px max(16px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: none; }
  .sheet .inner { max-width: 640px; margin: 0 auto; }
  .sheet.open, .sheet-bg.open { display: block; }
  .blockrow { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 6px; align-items: center; margin-bottom: 8px; }
  .blockwrap { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; }
  .blockwrap .seg { width: 100%; } .blockwrap .seg button { flex: 1; }
  .blockrow input { min-width: 0; width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 8px 10px; font-size: 13px; font-weight: 700; min-height: 40px; }
  .seg button.on.ho { background: var(--ho); color: #fff; }
  .seg button.on.b { background: var(--buero); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; min-height: 38px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-tab="heute" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Heute</button>
  <button data-tab="kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
  <button data-tab="uebersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Übersicht</button>
  <button data-tab="einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================================================================
   Stempelzeiten – Arbeitszeiterfassung (alle Daten lokal im Browser)
   ================================================================ */

const STORE_KEY = 'stempelzeiten-v1';
const WD_SHORT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WD_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

// Abwesenheiten (Kürzel wie in der Excel-Zeiterfassung: U / hU / K)
const ABW = {
  U:  { name: 'Urlaub', kurz: 'Urlaub', urlaub: 1, gutschrift: 1 },
  hU: { name: 'Halber Urlaubstag', kurz: '½ Urlaub', urlaub: 0.5, gutschrift: 0.5 },
  K:  { name: 'Krank', kurz: 'Krank', urlaub: 0, gutschrift: 1 },
  GZ: { name: 'Gleittag (Zeitausgleich)', kurz: 'Gleittag', urlaub: 0, gutschrift: 0 },
  SU: { name: 'Sonderurlaub / Dienstbefreiung', kurz: 'Sonder', urlaub: 0, gutschrift: 1 },
};
const PLAN = { HO: 'Homeoffice', B: 'Büro', MIX: 'Halb/halb' };

function defaultSettings() {
  return {
    // Normalzeiten je Wochentag (Index = getDay(): 0 = Sonntag)
    normal: [null, ['07:00', '16:15'], ['07:00', '16:15'], ['07:00', '16:15'], ['07:00', '16:15'], ['07:00', '11:30'], null],
    // Pausenregel aus der Excel-Vorlage: ab 4 h Arbeit 12 Min., ab 6 h 42 Min.
    pausen: [{ ab: 240, min: 12 }, { ab: 360, min: 42 }],
    hoZiel: 40,
    urlaubAnspruch: 30,
    urlaubUebertrag: {},          // { '2026': 6 } – manuell; sonst automatisch aus Vorjahresrest
    startSaldo: 0,                // Gleitzeit-Übertrag in Minuten
    startDatum: todayKey(),       // ab diesem Tag wird der Saldo gerechnet
    feiertage: { mariae: true, augsburg: false, heiligabend: false, silvester: false },
  };
}

/* ---------------- Speicher ---------------- */
let S = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = {};
  s.settings = Object.assign(defaultSettings(), s.settings || {});
  s.settings.feiertage = Object.assign(defaultSettings().feiertage, s.settings.feiertage || {});
  s.days = s.days || {};
  return s;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('Speichern fehlgeschlagen – bitte Backup exportieren.'); }
}
function getDay(key) { return S.days[key] || { bloecke: [], pausen: [] }; }
function setDay(key, d) {
  const empty = !(d.bloecke && d.bloecke.length) && !(d.pausen && d.pausen.length) && !d.abw && !d.plan && !d.notiz;
  if (empty) delete S.days[key]; else S.days[key] = d;
  save();
}
function cloneDay(key) { const d = getDay(key); return JSON.parse(JSON.stringify({ bloecke: d.bloecke || [], pausen: d.pausen || [], abw: d.abw || '', plan: d.plan || '', notiz: d.notiz || '' })); }

/* ---------------- Datum & Zeit ---------------- */
function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return keyOf(new Date()); }
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function toMin(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function toHHMM(min) { min = Math.round(min); return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
function nowHHMM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function fmtDur(min, signed) {
  const neg = min < 0; min = Math.round(Math.abs(min));
  const s = Math.floor(min / 60) + ':' + pad(min % 60);
  return signed ? (neg ? '−' : '+') + s : (neg ? '−' : '') + s;
}
function fmtH(min, digits = 1) { return (min / 60).toLocaleString('de-DE', { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
function fmtDate(k, opts) { return parseKey(k).toLocaleDateString('de-DE', opts || { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }); }
function fmtNum(n, d = 1) { return n.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d }); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------------- Bayerische Feiertage ---------------- */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
const holidayCache = {};
function holidays(y) {
  const opt = S.settings.feiertage;
  const sig = y + JSON.stringify(opt);
  if (holidayCache[sig]) return holidayCache[sig];
  const o = easter(y), map = {};
  const add = (d, name, halb) => { map[keyOf(d)] = { name, halb: !!halb }; };
  add(new Date(y, 0, 1), 'Neujahr');
  add(new Date(y, 0, 6), 'Heilige Drei Könige');
  add(addDays(o, -2), 'Karfreitag');
  add(addDays(o, 1), 'Ostermontag');
  add(new Date(y, 4, 1), 'Tag der Arbeit');
  add(addDays(o, 39), 'Christi Himmelfahrt');
  add(addDays(o, 50), 'Pfingstmontag');
  add(addDays(o, 60), 'Fronleichnam');
  if (opt.augsburg) add(new Date(y, 7, 8), 'Augsburger Friedensfest');
  if (opt.mariae) add(new Date(y, 7, 15), 'Mariä Himmelfahrt');
  add(new Date(y, 9, 3), 'Tag der Deutschen Einheit');
  add(new Date(y, 10, 1), 'Allerheiligen');
  if (opt.heiligabend) add(new Date(y, 11, 24), 'Heiligabend', true);
  add(new Date(y, 11, 25), '1. Weihnachtstag');
  add(new Date(y, 11, 26), '2. Weihnachtstag');
  if (opt.silvester) add(new Date(y, 11, 31), 'Silvester', true);
  return (holidayCache[sig] = map);
}
function holiday(k) { return holidays(+k.slice(0, 4))[k] || null; }

/* ---------------- Berechnungen ---------------- */
function pflichtpause(arbeitMin) {
  let p = 0;
  for (const r of S.settings.pausen) if (arbeitMin >= r.ab) p = Math.max(p, r.min);
  return p;
}
function normalSpan(wd) { const n = S.settings.normal[wd]; return n ? Math.max(0, toMin(n[1]) - toMin(n[0])) : 0; }
// Sollzeit (netto) = Normalzeit minus Pflichtpause → Mo–Do 8:33, Fr 4:18
function sollOf(k) {
  const d = parseKey(k), span = normalSpan(d.getDay());
  if (!span) return 0;
  const net = span - pflichtpause(span);
  const h = holiday(k);
  if (h) return h.halb ? Math.round(net / 2) : 0;
  return net;
}
function overlap(a1, a2, b1, b2) { return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }

// Liefert die Auswertung eines Tages. liveNow: offene Blöcke/Pausen bis jetzt rechnen.
function calcDay(k, liveNow) {
  const d = getDay(k), soll = sollOf(k);
  const isToday = k === todayKey(), now = nowMin();
  const bl = (d.bloecke || []).map(b => {
    const s = toMin(b.start); let e = b.ende ? toMin(b.ende) : (isToday && liveNow ? Math.max(now, s) : null);
    if (e !== null && e < s) e += 1440;          // über Mitternacht
    return { s, e, ort: b.ort === 'HO' ? 'HO' : 'B' };
  }).filter(b => b.s !== null && b.e !== null);
  const pa = (d.pausen || []).map(p => {
    const s = toMin(p.start); let e = p.ende ? toMin(p.ende) : (isToday && liveNow ? Math.max(now, s) : null);
    if (e !== null && e < s) e += 1440;
    return { s, e };
  }).filter(p => p.s !== null && p.e !== null);

  let roh = 0, gaps = 0, manPause = 0;
  const perBlock = bl.map(b => {
    let dur = b.e - b.s;
    for (const p of pa) { const o = overlap(b.s, b.e, p.s, p.e); dur -= o; manPause += o; }
    dur = Math.max(0, dur); roh += dur;
    return { ort: b.ort, dur };
  });
  const sorted = [...bl].sort((a, b) => a.s - b.s);
  for (let i = 1; i < sorted.length; i++) gaps += Math.max(0, sorted[i].s - sorted[i - 1].e);
  const unterbrechung = gaps + manPause;
  const zusatz = roh > 0 ? Math.max(0, pflichtpause(roh) - unterbrechung) : 0;
  const netto = Math.max(0, roh - zusatz);
  let ho = 0, buero = 0;
  for (const b of perBlock) { const share = roh ? b.dur / roh * netto : 0; if (b.ort === 'HO') ho += share; else buero += share; }

  const abw = d.abw && ABW[d.abw] ? ABW[d.abw] : null;
  const gutschrift = abw ? Math.round(soll * abw.gutschrift) : 0;
  const ist = netto + gutschrift;
  return {
    soll, ist, netto, ho, buero, roh, pauseGesamt: unterbrechung + zusatz, zusatz, gutschrift,
    abw: d.abw || '', urlaub: abw && soll > 0 ? abw.urlaub : 0, plan: d.plan || '',
    hatZeiten: bl.length > 0, offen: (d.bloecke || []).some(b => !b.ende), pauseOffen: (d.pausen || []).some(p => !p.ende),
  };
}

// Zählt ein Tag schon als "erfasst" (Vergangenheit) oder ist er Planung?
function isPast(k) { const t = todayKey(); return k < t || (k === t && (getDay(k).bloecke || []).length > 0) || (k === t && !!getDay(k).abw); }

function* daysOfYear(y) { for (let d = new Date(y, 0, 1); d.getFullYear() === y; d = addDays(d, 1)) yield keyOf(d); }
function* daysOfMonth(y, m) { for (let d = new Date(y, m, 1); d.getMonth() === m; d = addDays(d, 1)) yield keyOf(d); }

function monthStats(y, m) {
  const st = { soll: 0, ist: 0, diff: 0, ho: 0, buero: 0, urlaub: 0, urlaubPlan: 0, krank: 0 };
  const start = S.settings.startDatum;
  for (const k of daysOfMonth(y, m)) {
    const c = calcDay(k, true);
    if (isPast(k)) {
      st.ho += c.ho; st.buero += c.buero; st.urlaub += c.urlaub;
      if (c.abw === 'K') st.krank++;
      if (k >= start) { st.soll += c.soll; st.ist += c.ist; }
    } else st.urlaubPlan += c.urlaub;
  }
  st.diff = st.ist - st.soll;
  return st;
}

function saldoBis(k) {
  // Gleitzeitsaldo inkl. Starts-Saldo, bis einschließlich Tag k (nur erfasste Tage)
  let s = S.settings.startSaldo || 0;
  const start = parseKey(S.settings.startDatum), end = parseKey(k);
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const key = keyOf(d);
    if (!isPast(key)) continue;
    const c = calcDay(key, true);
    s += c.ist - c.soll;
  }
  return s;
}

function urlaubJahr(y, depth = 0) {
  const st = S.settings;
  let uebertrag = st.urlaubUebertrag[y];
  let auto = false;
  if (uebertrag === undefined || uebertrag === null || uebertrag === '') {
    const hatVorjahr = depth < 5 && Object.keys(S.days).some(k => k.startsWith((y - 1) + '-'));
    uebertrag = hatVorjahr ? Math.max(0, urlaubJahr(y - 1, depth + 1).rest) : 0;
    auto = hatVorjahr;
  }
  let genommen = 0, geplant = 0;
  for (const k of Object.keys(S.days)) {
    if (!k.startsWith(y + '-')) continue;
    const c = calcDay(k, false);
    if (!c.urlaub) continue;
    if (isPast(k)) genommen += c.urlaub; else geplant += c.urlaub;
  }
  const anspruch = +st.urlaubAnspruch || 0;
  return { anspruch, uebertrag: +uebertrag || 0, auto, genommen, geplant, rest: anspruch + (+uebertrag || 0) - genommen - geplant };
}

function hoJahr(y) {
  let istHO = 0, istB = 0, planHO = 0, planB = 0, offen = 0, offenTage = 0, planHOTage = 0;
  for (const k of daysOfYear(y)) {
    const c = calcDay(k, true);
    if (isPast(k)) { istHO += c.ho; istB += c.buero; continue; }
    const arbeit = Math.max(0, c.soll - (c.abw ? Math.round(c.soll * (ABW[c.abw]?.gutschrift || 0)) : 0));
    if (!arbeit) continue;
    if (c.plan === 'HO') { planHO += arbeit; planHOTage += arbeit / c.soll; }
    else if (c.plan === 'B') planB += arbeit;
    else if (c.plan === 'MIX') { planHO += arbeit / 2; planB += arbeit / 2; planHOTage += arbeit / c.soll / 2; }
    else { offen += arbeit; offenTage += arbeit / c.soll; }
  }
  const istGes = istHO + istB;
  const gesamt = istGes + planHO + planB + offen;
  const ziel = (S.settings.hoZiel || 0) / 100;
  const budget = ziel * gesamt - istHO - planHO;   // noch freie HO-Minuten im Jahr
  const avgTag = avgSoll();
  return {
    istHO, istB, istQuote: istGes ? istHO / istGes : 0,
    planHO, planB, offen, offenTage,
    prognose: (istGes + planHO + planB) ? (istHO + planHO) / (istGes + planHO + planB) : 0,
    budget, budgetTage: avgTag ? budget / avgTag : 0,
  };
}
function avgSoll() { let s = 0, n = 0; for (let wd = 1; wd <= 5; wd++) { const sp = normalSpan(wd); if (sp) { s += sp - pflichtpause(sp); n++; } } return n ? s / n : 0; }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = todayKey(), now = nowHHMM();
  const d = cloneDay(k);
  switch (act) {
    case 'kommen':
      d.bloecke.push({ start: now, ende: null, ort: b.dataset.ort }); setDay(k, d);
      toast(`Eingestempelt ${now} (${b.dataset.ort === 'HO' ? 'Homeoffice' : 'Büro'})`); break;
    case 'gehen':
      d.pausen.forEach(p => { if (!p.ende) p.ende = now; });

      toast(`Ausgestempelt ${now}`); break;
    case 'pauseStart': d.pausen.push({ start: now, ende: null }); setDay(k, d); toast(`Pause ab ${now}`); break;

function fillNormal(k, ort) {
  const n = S.settings.normal[parseKey(k).getDay()];
  if (!n) return false;
  const d = cloneDay(k);
  const h = holiday(k);
  if (h && !h.halb) return false;
  if (ort === 'MIX') {
    const s = toMin(n[0]), e = toMin(n[1]), mid = s + Math.round((e - s) / 2);
    d.bloecke = [{ start: n[0], ende: toHHMM(mid), ort: 'B' }, { start: toHHMM(mid), ende: n[1], ort: 'HO' }];
  } else {
    let end = n[1];
    if (h && h.halb) { const s = toMin(n[0]); end = toHHMM(s + Math.round((toMin(n[1]) - s) / 2)); }
    d.bloecke = [{ start: n[0], ende: end, ort }];
  }
  d.pausen = []; d.abw = '';
  setDay(k, d);
  return true;
}

function dayClass(k) {
  const c = calcDay(k, true), wd = parseKey(k).getDay(), h = holiday(k), past = isPast(k);
  const cls = ['day'];
  let lbl = '', hrs = '';
  if (k === todayKey()) cls.push('today');
  if (c.abw) { cls.push('k-' + c.abw.toLowerCase()); lbl = ABW[c.abw].kurz; if (!past) cls.push('plan'); }
  if (h) { cls.push('ft'); lbl = lbl || h.name; }
  else if (!c.soll && !c.hatZeiten) cls.push('we');
  if (c.hatZeiten) {
    if (!c.abw) cls.push(c.ho && c.buero ? 'k-mix' : c.ho ? 'k-ho' : 'k-b');

  } else if (c.plan && !c.abw && c.soll) {

  } else if (past && c.soll > 0 && !c.abw && k >= S.settings.startDatum && k !== todayKey()) {

}

function applyBrush(k, br) {

    if (!soll) { toast('Kein Arbeitstag'); return; }

    setDay(k, d); return;
  }

function importFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data.days !== 'object') throw new Error();
      localStorage.setItem(STORE_KEY, JSON.stringify(data)); S = load(); toast('Backup geladen'); render();
    } catch (err) { toast('Datei ist kein gültiges Backup.'); }
  };
  r.readAsText(f);
}
function download(name, text, type) {
  const blob = new Blob([text], { type }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV(y, m) {
  const lines = [['Datum', 'Wochentag', 'Beginn', 'Ende', 'Ort', 'Pausen', 'Abwesenheit', 'Soll (h)', 'Ist (h)', 'HO (h)', 'Büro (h)', '+/- (h)', 'Feiertag', 'Notiz'].join(';')];
  const keys = m === null ? [...daysOfYear(y)] : [...daysOfMonth(y, m)];
  const dec = x => (x / 60).toFixed(2).replace('.', ',');
  for (const k of keys) {
    const d = getDay(k), c = calcDay(k, false), h = holiday(k);
    if (!c.soll && !c.hatZeiten && !d.abw) continue;
    const bl = d.bloecke || [];
    lines.push([
      fmtDate(k, { day: '2-digit', month: '2-digit', year: 'numeric' }), WD_SHORT[parseKey(k).getDay()],
      bl.map(b => b.start).join(' / '), bl.map(b => b.ende || '').join(' / '), bl.map(b => b.ort === 'HO' ? 'H' : 'B').join(' / '),
      dec(c.pauseGesamt), d.abw || '', dec(c.soll), dec(c.ist), dec(c.ho), dec(c.buero), isPast(k) ? dec(c.ist - c.soll) : '',
      h ? h.name : '', (d.notiz || '').replace(/[;\n]/g, ' '),
    ].join(';'));
  }
  download(`stempelzeiten-${y}${m === null ? '' : '-' + pad(m + 1)}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}

/* ---------------- PWA ---------------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'einstellungen') renderEinstellungen(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
